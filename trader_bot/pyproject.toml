[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-scalper"
version = "0.1.0"
description = "Hyperliquid book-imbalance scalper lab (paper-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hl-scalper = "hl_scalper.loop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
