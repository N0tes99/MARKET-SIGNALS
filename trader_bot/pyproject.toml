[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-scalper"
version = "0.3.0"
description = "Hyperliquid book-imbalance scalper lab (paper-first, live-gated)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "hyperliquid-python-sdk>=0.18",
  "eth-account>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hl-scalper = "hl_scalper.loop:main"
hl-scalper-report = "hl_scalper.report:main"
hl-scalper-replay = "hl_scalper.replay:main"
hl-scalper-ui = "hl_scalper.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
