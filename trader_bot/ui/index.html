<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#10161a" />
  <title>HL AGENT DESK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="stage">
    <header class="hero">
      <p class="brand">HL AGENT DESK</p>
      <h1 class="tag">LIVE ENSEMBLE</h1>
      <p class="sub">Specialists vote. Disagreement sits out.</p>
      <div class="cta-row" id="status-pills" role="status" aria-live="polite">
        <span class="pix-pill" id="pill-alive">LINK --</span>
        <span class="pix-pill" id="pill-mode">MODE --</span>
        <span class="pix-pill" id="pill-tick">TICK --</span>
        <span class="pix-pill" id="pill-kill">KILL --</span>
        <span class="pix-pill" id="pill-arm">ARM --</span>
        <span class="pix-pill" id="pill-dry">DRY --</span>
      </div>
    </header>

    <section class="agents" id="agent-grid" aria-label="Agent votes"></section>

    <section class="strategies" aria-label="Strategies in play">
      <h2 class="panel-title">STRATEGIES</h2>
      <div class="strat-grid" id="strat-grid"></div>
    </section>

    <section class="board board-3" aria-label="Decision board">
      <div class="panel">
        <h2 class="panel-title" id="decision-heading">DECISION</h2>
        <p class="decision" id="decision-text" aria-live="polite" aria-labelledby="decision-heading">WAITING...</p>
        <p class="meta" id="decision-meta"></p>
      </div>
      <div class="panel position-panel">
        <h2 class="panel-title" id="position-heading">POSITION</h2>
        <p class="position-state" id="position-state" aria-live="polite">FLAT</p>
        <p class="meta" id="position-meta"></p>
      </div>
      <div class="panel stats">
        <h2 class="panel-title">TALLY</h2>
        <div class="stat-grid dense">
          <div><span class="k">FILLS</span><span class="v" id="stat-fills">0</span></div>
          <div><span class="k">EXITS</span><span class="v" id="stat-exits">0</span></div>
          <div><span class="k">W / L</span><span class="v" id="stat-wl">0/0</span></div>
          <div><span class="k">EXP</span><span class="v" id="stat-exp">0</span></div>
          <div><span class="k">SIT</span><span class="v" id="stat-sit">0</span></div>
          <div><span class="k">BLOCK</span><span class="v" id="stat-block">0</span></div>
          <div><span class="k">KILL</span><span class="v" id="stat-kill">0</span></div>
          <div><span class="k">PNL</span><span class="v" id="stat-pnl">0</span></div>
        </div>
      </div>
    </section>

    <section class="feed-wrap" aria-labelledby="tape-heading">
      <h2 class="panel-title" id="tape-heading">TAPE</h2>
      <div class="feed" id="event-feed" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
