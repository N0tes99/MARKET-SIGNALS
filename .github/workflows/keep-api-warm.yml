# Ping endpoints so Render free-tier spins down less often, and so
# /assets scoring (+ Discord alerts) and the CME futures board can run
# without site visitors.
#
# Cost optimisation: all pings run as sequential steps in ONE job so
# GitHub bills 1 minute per trigger instead of 4. The single health
# wake at the top serves all subsequent endpoint pings.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
      API_ASSETS_URL: ${{ vars.API_ASSETS_URL }}
      API_FUTURES_BOARD_URL: ${{ vars.API_FUTURES_BOARD_URL }}
      API_PAPER_CRON_URL: ${{ vars.API_PAPER_CRON_URL }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Resolve URLs
        id: urls
        run: |
          normalize_path() {
            local raw="$1" append="$2" trimmed rest
            trimmed="${raw%/}"
            rest="${trimmed#*://}"
            if [[ "$rest" != */* ]]; then
              echo "::warning::URL has no path (got: $raw) — appending ${append}" >&2
              echo "${trimmed}${append}"
            else
              echo "$trimmed"
            fi
          }

          if [ -z "${API_HEALTH_URL:-}" ]; then
            echo "::error::API_HEALTH_URL repo variable is not set. Go to Settings → Secrets and variables → Actions → Variables and add API_HEALTH_URL=https://<your-render-host>/api/v1/health"
            exit 1
          fi
          HEALTH=$(normalize_path "${API_HEALTH_URL}" "/api/v1/health")

          if [ -z "${API_ASSETS_URL:-}" ]; then
            echo "::warning::API_ASSETS_URL not set — assets warm-up skipped"
            ASSETS=""
          else
            ASSETS=$(normalize_path "${API_ASSETS_URL}" "/api/v1/assets")
          fi
          case "$ASSETS" in *\?*) ASSETS="${ASSETS}&sync=true" ;; *) ASSETS="${ASSETS}?sync=true" ;; esac

          if [ -n "${API_FUTURES_BOARD_URL:-}" ]; then
            FUTURES=$(normalize_path "${API_FUTURES_BOARD_URL}" "/api/v1/futures/board")
          else
            BASE="${HEALTH%/api/v1/health}"
            FUTURES="${BASE}/api/v1/futures/board"
          fi
          case "$FUTURES" in *\?*) FUTURES="${FUTURES}&sync=true" ;; *) FUTURES="${FUTURES}?sync=true" ;; esac

          if [ -n "${API_PAPER_CRON_URL:-}" ]; then
            PAPER=$(normalize_path "${API_PAPER_CRON_URL}" "/api/v1/paper/cron-tick")
          else
            BASE="${HEALTH%/api/v1/health}"
            PAPER="${BASE}/api/v1/paper/cron-tick"
          fi

          echo "health=$HEALTH"   >> "$GITHUB_OUTPUT"
          echo "assets=$ASSETS"   >> "$GITHUB_OUTPUT"
          echo "futures=$FUTURES" >> "$GITHUB_OUTPUT"
          echo "paper=$PAPER"     >> "$GITHUB_OUTPUT"

      - name: Wake API (health check)
        run: |
          URL="${{ steps.urls.outputs.health }}"
          echo "Pinging $URL"
          HTTP_CODE=$(curl -sS -o /tmp/health_body -w "%{http_code}" --max-time 60 "$URL" || true)
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Health returned HTTP ${HTTP_CODE} — /api/v1/health must be public (no auth)"
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health returned HTTP ${HTTP_CODE} (expected 200)"
            head -c 500 /tmp/health_body || true
            exit 1
          fi
          echo "OK (HTTP ${HTTP_CODE})"
          # Let the API finish booting before hitting heavier endpoints
          sleep 8

      - name: Ping assets (warm rank_all cache)
        continue-on-error: true
        run: |
          URL="${{ steps.urls.outputs.assets }}"
          if [ -z "$URL" ]; then
            echo "::warning::API_ASSETS_URL not set — skipping assets warm-up"
            exit 0
          fi
          AUTH_ARGS=()
          [ -n "${API_USERNAME:-}" ] && [ -n "${API_PASSWORD:-}" ] && \
            AUTH_ARGS=(-u "${API_USERNAME}:${API_PASSWORD}")
          CRON_ARGS=()
          [ -n "${CRON_SECRET:-}" ] && CRON_ARGS=(-H "X-Cron-Secret: ${CRON_SECRET}")

          echo "Pinging $URL (max 180s)"
          HTTP_CODE=$(curl -sS -o /tmp/assets_body -w "%{http_code}" --max-time 180 \
            "${AUTH_ARGS[@]}" "${CRON_ARGS[@]}" "$URL" || true)
          case "$HTTP_CODE" in
            200) echo "OK (HTTP ${HTTP_CODE})" ;;
            401|403) echo "::warning::Assets HTTP ${HTTP_CODE} — check API_USERNAME/API_PASSWORD and CRON_SECRET" ;;
            *)   echo "::warning::Assets HTTP ${HTTP_CODE} (cold start / timeout)"; head -c 200 /tmp/assets_body || true ;;
          esac

      - name: Ping futures board (warm Yahoo =F cache)
        continue-on-error: true
        run: |
          URL="${{ steps.urls.outputs.futures }}"
          AUTH_ARGS=()
          [ -n "${API_USERNAME:-}" ] && [ -n "${API_PASSWORD:-}" ] && \
            AUTH_ARGS=(-u "${API_USERNAME}:${API_PASSWORD}")
          CRON_ARGS=()
          [ -n "${CRON_SECRET:-}" ] && CRON_ARGS=(-H "X-Cron-Secret: ${CRON_SECRET}")

          echo "Pinging $URL (max 180s)"
          HTTP_CODE=$(curl -sS -o /tmp/futures_body -w "%{http_code}" --max-time 180 \
            "${AUTH_ARGS[@]}" "${CRON_ARGS[@]}" "$URL" || true)
          case "$HTTP_CODE" in
            200) echo "OK (HTTP ${HTTP_CODE})" ;;
            401|403) echo "::warning::Futures HTTP ${HTTP_CODE} — check API_USERNAME/API_PASSWORD and CRON_SECRET" ;;
            *)   echo "::warning::Futures HTTP ${HTTP_CODE} (cold start / timeout)"; head -c 200 /tmp/futures_body || true ;;
          esac

      - name: Tick paper agent
        continue-on-error: true
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::CRON_SECRET not set — skipping paper cron-tick"
            exit 0
          fi
          URL="${{ steps.urls.outputs.paper }}"
          AUTH_ARGS=()
          [ -n "${API_USERNAME:-}" ] && [ -n "${API_PASSWORD:-}" ] && \
            AUTH_ARGS=(-u "${API_USERNAME}:${API_PASSWORD}")

          echo "POST $URL (max 180s)"
          HTTP_CODE=$(curl -sS -o /tmp/paper_body -w "%{http_code}" --max-time 180 \
            -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${AUTH_ARGS[@]}" \
            "$URL" || true)
          case "$HTTP_CODE" in
            200) echo "OK (HTTP ${HTTP_CODE})"; head -c 400 /tmp/paper_body || true ;;
            401|403) echo "::warning::Paper cron-tick HTTP ${HTTP_CODE} — check CRON_SECRET + Basic Auth" ;;
            503) echo "::warning::Paper cron-tick 503 — CRON_SECRET on Render may not match" ;;
            *)   echo "::warning::Paper cron-tick HTTP ${HTTP_CODE}"; head -c 300 /tmp/paper_body || true ;;
          esac
