# Ping endpoints so Render free-tier spins down less often, and so
# /assets scoring (+ Discord alerts) and the CME futures board can run
# without site visitors.
#
# Cost optimisation: all pings run in ONE job / ONE step so GitHub bills
# 1 minute per trigger. Derived futures/paper URLs stay in local bash
# variables — never GITHUB_ENV — so public logs cannot dump them.
#
# Store API_*_URL as Actions *secrets* (not variables). GitHub redacts
# the exact secret; rewritten paths are not secrets unless we keep them
# off the log entirely.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      API_HEALTH_URL: ${{ secrets.API_HEALTH_URL || vars.API_HEALTH_URL }}
      API_ASSETS_URL: ${{ secrets.API_ASSETS_URL || vars.API_ASSETS_URL }}
      API_FUTURES_BOARD_URL: ${{ secrets.API_FUTURES_BOARD_URL || vars.API_FUTURES_BOARD_URL }}
      API_PAPER_CRON_URL: ${{ secrets.API_PAPER_CRON_URL || vars.API_PAPER_CRON_URL }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Warm API
        run: |
          set +x
          normalize_path() {
            local raw="$1" append="$2" trimmed rest
            trimmed="${raw%/}"
            rest="${trimmed#*://}"
            if [[ "$rest" != */* ]]; then
              echo "::warning::URL has no path — appending ${append}" >&2
              echo "${trimmed}${append}"
            else
              echo "$trimmed"
            fi
          }

          http_get() {
            local url="$1" timeout="$2"
            curl -sS -o /tmp/keepwarm_body -w "%{http_code}" --max-time "$timeout" \
              "${AUTH_ARGS[@]}" "${CRON_ARGS[@]}" "$url" 2>/dev/null || echo "000"
          }

          if [ -z "${API_HEALTH_URL:-}" ]; then
            echo "::error::API_HEALTH_URL is not set. Add it as an Actions secret with full path /api/v1/health."
            exit 1
          fi
          HEALTH=$(normalize_path "${API_HEALTH_URL}" "/api/v1/health")

          if [ -z "${API_ASSETS_URL:-}" ]; then
            ASSETS=""
          else
            ASSETS=$(normalize_path "${API_ASSETS_URL}" "/api/v1/assets")
            case "$ASSETS" in *\?*) ASSETS="${ASSETS}&sync=true" ;; *) ASSETS="${ASSETS}?sync=true" ;; esac
          fi

          if [ -n "${API_FUTURES_BOARD_URL:-}" ]; then
            FUTURES=$(normalize_path "${API_FUTURES_BOARD_URL}" "/api/v1/futures/board")
          else
            BASE="${HEALTH%/api/v1/health}"
            FUTURES="${BASE}/api/v1/futures/board"
          fi
          case "$FUTURES" in *\?*) FUTURES="${FUTURES}&sync=true" ;; *) FUTURES="${FUTURES}?sync=true" ;; esac

          if [ -n "${API_PAPER_CRON_URL:-}" ]; then
            PAPER=$(normalize_path "${API_PAPER_CRON_URL}" "/api/v1/paper/cron-tick")
          else
            BASE="${HEALTH%/api/v1/health}"
            PAPER="${BASE}/api/v1/paper/cron-tick"
          fi

          AUTH_ARGS=()
          [ -n "${API_USERNAME:-}" ] && [ -n "${API_PASSWORD:-}" ] && \
            AUTH_ARGS=(-u "${API_USERNAME}:${API_PASSWORD}")
          CRON_ARGS=()
          [ -n "${CRON_SECRET:-}" ] && CRON_ARGS=(-H "X-Cron-Secret: ${CRON_SECRET}")

          echo "Pinging health"
          HTTP_CODE=$(curl -sS -o /tmp/keepwarm_body -w "%{http_code}" --max-time 60 "$HEALTH" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Health returned HTTP ${HTTP_CODE} — /api/v1/health must be public (no auth)"
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health returned HTTP ${HTTP_CODE} (expected 200)"
            exit 1
          fi
          echo "OK (HTTP ${HTTP_CODE})"
          sleep 3

          # Paper tick first: /assets?sync=true can run 100s+ and starve cron-tick
          # with a Render 502 after a cold start. Retry transient gateway errors.
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::CRON_SECRET not set — skipping paper cron-tick"
          else
            echo "POST paper cron-tick (max 90s, 3 attempts)"
            HTTP_CODE="000"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              HTTP_CODE=$(curl -sS -o /tmp/keepwarm_body -w "%{http_code}" --max-time 90 \
                -X POST \
                -H "X-Cron-Secret: ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                "${AUTH_ARGS[@]}" \
                "$PAPER" 2>/dev/null || echo "000")
              case "$HTTP_CODE" in
                200|401|403|503) break ;;
              esac
              echo "Paper cron-tick HTTP ${HTTP_CODE} (attempt ${attempt}/3)"
              attempt=$((attempt + 1))
              if [ "$attempt" -le 3 ]; then
                sleep 5
              fi
            done
            case "$HTTP_CODE" in
              200) echo "OK (HTTP ${HTTP_CODE})" ;;
              401|403) echo "::warning::Paper cron-tick HTTP ${HTTP_CODE} — check CRON_SECRET + Basic Auth" ;;
              503) echo "::warning::Paper cron-tick 503 — CRON_SECRET on Render may not match" ;;
              *) echo "::warning::Paper cron-tick HTTP ${HTTP_CODE}" ;;
            esac
          fi

          if [ -z "$ASSETS" ]; then
            echo "::warning::API_ASSETS_URL not set — skipping assets warm-up"
          else
            echo "Pinging assets (max 180s)"
            HTTP_CODE=$(http_get "$ASSETS" 180)
            case "$HTTP_CODE" in
              200) echo "OK (HTTP ${HTTP_CODE})" ;;
              401|403) echo "::warning::Assets HTTP ${HTTP_CODE} — check API_USERNAME/API_PASSWORD and CRON_SECRET" ;;
              *) echo "::warning::Assets HTTP ${HTTP_CODE} (cold start / timeout)" ;;
            esac
          fi

          echo "Pinging futures (max 180s)"
          HTTP_CODE=$(http_get "$FUTURES" 180)
          case "$HTTP_CODE" in
            200) echo "OK (HTTP ${HTTP_CODE})" ;;
            401|403) echo "::warning::Futures HTTP ${HTTP_CODE} — check API_USERNAME/API_PASSWORD and CRON_SECRET" ;;
            *) echo "::warning::Futures HTTP ${HTTP_CODE} (cold start / timeout)" ;;
          esac
