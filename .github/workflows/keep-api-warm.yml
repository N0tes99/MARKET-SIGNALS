# Ping public endpoints on a schedule so free-tier hosts
# (e.g. Render) spin down less often, and so scoring/Discord
# alerts can run without site visitors. Schedules can drift on free Actions.
name: Keep API warm

on:
  schedule:
    # Health: every 12 minutes (GitHub may delay free-plan schedules).
    - cron: "*/12 * * * *"
    # Assets scan: every 30 minutes (score + Discord alerts).
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/12 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # Optional repo variable: Settings → Variables → API_HEALTH_URL
          # Prefer direct Render URL, e.g. https://YOUR-SERVICE.onrender.com/api/v1/health
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          URL="${API_HEALTH_URL:-https://signals27.netlify.app/api/backend/api/v1/health}"
          echo "Pinging $URL"
          curl -fsS --max-time 60 "$URL"
          echo
          echo "OK"

  ping-assets:
    # Soft-fail: cold starts / 502 must not fail the keep-warm workflow.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping assets endpoint
        env:
          # Optional repo variable: Settings → Variables → API_ASSETS_URL
          API_ASSETS_URL: ${{ vars.API_ASSETS_URL }}
        run: |
          URL="${API_ASSETS_URL:-https://signals27.netlify.app/api/backend/api/v1/assets}"
          echo "Pinging $URL (max 120s; timeouts/502 are non-fatal)"
          if curl -fsS --max-time 120 "$URL" -o /dev/null; then
            echo "OK"
          else
            echo "::warning::Assets ping failed or timed out (cold start / 502 is OK)"
            exit 1
          fi
