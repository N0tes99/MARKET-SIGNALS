<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Secret string generator</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e8e6e3; background: #12141a; }
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-weight: 500; font-size: 1.25rem; }
    button { margin: 0.25rem 0.5rem 0.25rem 0; padding: 0.5rem 0.9rem; cursor: pointer; }
    pre { background: #1c1f28; padding: 1rem; overflow: auto; border-radius: 8px; font-size: 0.85rem; }
    .muted { color: #9a958d; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Secret string generator</h1>
  <p class="muted">Generates long random values for SECRET_KEY / AUTH_PASSWORD. Download stores a file on this computer only.</p>
  <button type="button" id="gen">Generate</button>
  <button type="button" id="copy">Copy</button>
  <button type="button" id="dl">Download secrets.local.env</button>
  <pre id="out">Click Generate…</pre>
  <script>
    const alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#%^&*-_=+";
    function rand(n, set) {
      const a = new Uint32Array(n);
      crypto.getRandomValues(a);
      let s = "";
      for (let i = 0; i < n; i++) s += set[a[i] % set.length];
      return s;
    }
    function urlSafe(n) {
      const bytes = new Uint8Array(n);
      crypto.getRandomValues(bytes);
      let bin = "";
      bytes.forEach((b) => (bin += String.fromCharCode(b)));
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function build() {
      const secret = urlSafe(48);
      const pass = rand(32, alphabet);
      return `# Generated locally — do not commit
SECRET_KEY=${secret}
AUTH_USERNAME=signal
AUTH_PASSWORD=${pass}
APP_ENV=production
APP_DEBUG=false
SIGNAL_STORE=postgres
`;
    }
    let text = "";
    document.getElementById("gen").onclick = () => {
      text = build();
      document.getElementById("out").textContent = text;
    };
    document.getElementById("copy").onclick = async () => {
      if (!text) text = build();
      document.getElementById("out").textContent = text;
      await navigator.clipboard.writeText(text);
    };
    document.getElementById("dl").onclick = () => {
      if (!text) text = build();
      document.getElementById("out").textContent = text;
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "secrets.local.env";
      a.click();
      URL.revokeObjectURL(a.href);
    };
  </script>
</body>
</html>
